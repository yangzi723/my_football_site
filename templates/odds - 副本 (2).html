<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今日足球数据 · 2026-09-04</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        /* 页面独有样式 */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #f6f9fc;
            padding: 32px 20px;
        }
        .container {
            max-width: 1360px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 20px 40px -12px rgba(0,20,40,0.12);
            padding: 24px 20px 28px;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            padding-bottom: 18px;
            border-bottom: 2px solid #eef2f6;
            margin-bottom: 24px;
        }
        .header h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.4px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #0b1a2e;
        }
        .header h1 span {
            background: #eef2f6;
            font-size: 15px;
            font-weight: 500;
            padding: 4px 14px;
            border-radius: 40px;
            color: #1e3a5f;
        }
        .header .meta {
            font-size: 14px;
            color: #4b5f73;
            background: #f0f4f9;
            padding: 6px 18px;
            border-radius: 30px;
            font-weight: 500;
        }
        .table-wrap {
            overflow-x: auto;
            border-radius: 18px;
            border: 1px solid #e6ecf3;
            background: #ffffff;
            user-select: none;
        }
        table {
            width: 100%;
            table-layout: fixed;
            border-collapse: collapse;
            font-size: 14px;
            min-width: 600px;
        }
        /* 显示列宽线：为所有单元格添加边框 */
        th, td {
            border: 1px solid #dce3ec;
            padding: 13px 14px;
            vertical-align: middle;
            line-height: 1.5;
        }
        thead {
            background: #f8fafd;
            border-bottom: 2px solid #dce3ec;
        }
        th {
            text-align: left;
            font-weight: 600;
            font-size: 12px;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            color: #2f4057;
            white-space: nowrap;
            position: sticky;
            top: 0;
            background: #f8fafd;
            z-index: 2;
            position: relative;
            overflow: visible;
            /* 表头边框稍深 */
            border-color: #c8d2df;
        }
        td {
            word-break: break-word;
        }
        tbody tr:hover {
            background: #f5f9ff;
            transition: background 0.12s;
        }
        tbody tr:nth-child(even) {
            background: #fbfdff;
        }

        /* 拖动手柄 */
        .col-resizer {
            position: absolute;
            top: 0;
            right: -5px;
            width: 10px;
            height: 100%;
            cursor: col-resize;
            z-index: 3;
            background: transparent;
            transition: background 0.1s;
        }
        .col-resizer:hover,
        .col-resizer.active {
            background: rgba(59, 124, 255, 0.25);
            border-right: 2px solid #3b7cff;
        }

        .league-tag {
            display: inline-block;
            background: #e3eaf2;
            color: #1e3b5c;
            font-weight: 600;
            font-size: 11.5px;
            padding: 3px 12px;
            border-radius: 40px;
            white-space: nowrap;
        }
        .match-team {
            font-weight: 500;
            color: #0f1f33;
            white-space: nowrap;
        }
        .match-team .vs {
            color: #8a9db0;
            font-weight: 400;
            margin: 0 5px;
        }
        .time-cell {
            font-weight: 500;
            color: #1a3148;
            white-space: nowrap;
        }
        .score-cell {
            font-weight: 600;
            text-align: center;
            color: #1f3a57;
            white-space: nowrap;
        }
        .score-cell .empty {
            color: #a2b7cb;
            font-weight: 400;
        }
        .prompt-cell {
            font-size: 12px;
            color: #1f384f;
            word-break: break-word;
            line-height: 1.4;
        }
        .prompt-cell .badge {
            display: inline-block;
            background: #dce5ef;
            color: #1d3a59;
            font-size: 9px;
            font-weight: 600;
            padding: 1px 6px;
            border-radius: 30px;
            margin-right: 2px;
        }
        .footer-note {
            margin-top: 24px;
            font-size: 13px;
            color: #5b728a;
            text-align: right;
            border-top: 1px solid #e6edf5;
            padding-top: 18px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
        }
        .footer-note .count {
            background: #eef3f9;
            padding: 3px 14px;
            border-radius: 30px;
            font-weight: 500;
        }
        @media (max-width: 720px) {
            body { padding: 16px 12px; }
            .container { padding: 16px 12px; }
            .header h1 { font-size: 20px; }
            th, td { padding: 10px 10px; font-size: 13px; }
            .league-tag { font-size: 10px; padding: 2px 8px; }
        }
        @media (max-width: 480px) {
            th, td { padding: 8px 6px; font-size: 12px; }
            .match-team { font-size: 12px; }
            .time-cell { font-size: 12px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="top-nav">
        <a href="/fixtures">📅 赛事列表</a>
        <a href="/">📊 基本面分析</a>
        <a href="/odds" class="active">🎯 赔率预测</a>
        <a href="/history">📋 预测/复盘</a>
        <a href="/stats">📈 统计</a>
    </div>

    <div class="header">
        <h1>
            ⚽ 今日足球数据
            <span>2026-09-04</span>
        </h1>
        <div class="meta">📋 共 <span id="matchCount">2</span> 场</div>
    </div>

    <div class="table-wrap">
        <table id="oddsTable">
            <thead>
                <tr>
                    <th id="col0" data-col="0">时间<div class="col-resizer" data-col="0"></div></th>
                    <th id="col1" data-col="1">联赛<div class="col-resizer" data-col="1"></div></th>
                    <th id="col2" data-col="2">主队 VS 客队<div class="col-resizer" data-col="2"></div></th>
                    <th id="col3" data-col="3" style="text-align:center;">亚初终<div class="col-resizer" data-col="3"></div></th>
                    <th id="col4" data-col="4">基本面判断<div class="col-resizer" data-col="4"></div></th>
                </tr>
            </thead>
            <tbody id="matchBody">
                <!-- 动态生成 -->
            </tbody>
        </table>
    </div>

    <div class="footer-note">
        <span>📌 数据来源：今日足球数据_2026-09-04</span>
        <span class="count">可拖动列宽 · 显示列边框</span>
    </div>
</div>

<script>
    (function() {
        "use strict";

        const DEFAULT_WIDTHS = [80, 100, 200, 80, 150];
        const STORAGE_KEY = 'odds_col_widths';

        const table = document.getElementById('oddsTable');
        const cols = table.querySelectorAll('thead th');
        const resizers = table.querySelectorAll('.col-resizer');

        let savedWidths = null;
        try {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                const parsed = JSON.parse(stored);
                if (Array.isArray(parsed) && parsed.length === cols.length) {
                    savedWidths = parsed;
                }
            }
        } catch(e) {}

        const widths = savedWidths ? savedWidths.slice() : DEFAULT_WIDTHS.slice();

        function applyWidths() {
            cols.forEach((th, index) => {
                const w = widths[index] || DEFAULT_WIDTHS[index] || 100;
                th.style.width = w + 'px';
                th.style.minWidth = w + 'px';
                th.style.maxWidth = w + 'px';
            });
        }
        applyWidths();

        function saveWidths() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(widths));
            } catch(e) {}
        }

        let isDragging = false;
        let currentCol = -1;
        let startX = 0;
        let startWidth = 0;

        resizers.forEach(resizer => {
            resizer.addEventListener('mousedown', function(e) {
                e.preventDefault();
                e.stopPropagation();

                const col = parseInt(this.dataset.col, 10);
                if (isNaN(col)) return;

                isDragging = true;
                currentCol = col;
                startX = e.pageX;
                startWidth = widths[col] || DEFAULT_WIDTHS[col] || 100;

                this.classList.add('active');
                document.body.style.cursor = 'col-resize';
                document.body.style.userSelect = 'none';

                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            });
        });

        function onMouseMove(e) {
            if (!isDragging || currentCol < 0) return;

            const delta = e.pageX - startX;
            let newWidth = startWidth + delta;
            if (newWidth < 40) newWidth = 40;

            widths[currentCol] = newWidth;

            const th = cols[currentCol];
            th.style.width = newWidth + 'px';
            th.style.minWidth = newWidth + 'px';
            th.style.maxWidth = newWidth + 'px';

            saveWidths();
        }

        function onMouseUp(e) {
            if (isDragging) {
                document.querySelectorAll('.col-resizer.active').forEach(el => el.classList.remove('active'));
                document.body.style.cursor = '';
                document.body.style.userSelect = '';
                isDragging = false;
                currentCol = -1;
            }
            document.removeEventListener('mousemove', onMouseMove);
            document.removeEventListener('mouseup', onMouseUp);
        }

        // 渲染数据
        const matches = [
            { time: "00:30", league: "德乙", home: "汉诺威96", away: "卡斯鲁厄", score: "", prompt: "站位" },
            { time: "01:00", league: "法甲", home: "里昂", away: "欧塞尔", score: "", prompt: "站位" }
        ];

        const tbody = document.getElementById('matchBody');
        let html = '';
        matches.forEach(m => {
            const scoreDisplay = m.score ? m.score : '<span class="empty">—</span>';
            const fullPrompt = m.prompt;
            const shortPrompt = fullPrompt.length > 20 ? fullPrompt.substring(0, 20) + '…' : fullPrompt;
            html += `
                <tr>
                    <td class="time-cell">${m.time}</td>
                    <td><span class="league-tag">${m.league}</span></td>
                    <td class="match-team">${m.home} <span class="vs">VS</span> ${m.away}</td>
                    <td class="score-cell">${scoreDisplay}</td>
                    <td class="prompt-cell" title="${fullPrompt}"><span class="badge">📋</span> ${shortPrompt}</td>
                </tr>
            `;
        });
        tbody.innerHTML = html;
        document.getElementById('matchCount').textContent = matches.length;
    })();
</script>
</body>
</html>
