<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>历史记录</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .action-btn { padding: 4px 10px; border-radius: 6px; border: none; cursor: pointer; font-size: 13px; margin-right: 4px; }
        .edit-btn { background: #3b7cff; color: white; }
        .edit-btn:hover { background: #2563eb; }
        .delete-btn { background: #dc2626; color: white; }
        .delete-btn:hover { background: #b91c1c; }
        .predict-btn { background: #0f973d; color: white; }
        .predict-btn:hover { background: #0b7a30; }
        .import-btn { background: #8b5cf6; color: white; }
        .import-btn:hover { background: #7c3aed; }
        .add-btn { background: #d97706; color: white; }
        .add-btn:hover { background: #b45309; }
        .filter-row { display: flex; gap: 15px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
        .filter-row input, .filter-row button { padding: 8px 14px; border-radius: 8px; border: 1px solid #cdd8e6; font-size: 14px; }
        .filter-row button { background: #1a3a6b; color: white; border: none; cursor: pointer; }
        .filter-row button:hover { background: #0f2a4a; }
        .team-link { color: #1a3a6b; text-decoration: none; font-weight: 500; cursor: pointer; }
        .team-link:hover { text-decoration: underline; color: #3b7cff; }
        .section-divider { margin: 30px 0 20px; border-top: 2px solid #e2e8f0; padding-top: 20px; }
        .section-title { font-size: 20px; font-weight: 600; color: #1f3a5f; margin: 0; }

        .modal-edit { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal-edit-content { background: white; border-radius: 16px; max-width: 950px; width: 95%; max-height: 90vh; padding: 20px 25px; overflow-y: auto; }
        .modal-edit-content .form-group { margin-bottom: 8px; display: flex; align-items: center; }
        .modal-edit-content .form-group label { width: 120px; font-weight: 500; font-size: 13px; color: #2d3f55; }
        .modal-edit-content .form-group input, .modal-edit-content .form-group select { flex: 1; padding: 6px 10px; border: 1px solid #cdd8e6; border-radius: 6px; font-size: 13px; }
        .modal-edit-content .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 600px) { .modal-edit-content .two-col { grid-template-columns: 1fr; } }
        .modal-edit-content .section-title { font-weight: 600; color: #1f3a5f; margin: 10px 0 5px 0; font-size: 14px; border-left: 4px solid #3b7cff; padding-left: 10px; }
        .modal-edit-content .btn-group { margin-top: 15px; display: flex; gap: 10px; }

        .modal-select { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1001; justify-content: center; align-items: center; }
        .modal-select-content { background: white; border-radius: 16px; max-width: 1100px; width: 95%; max-height: 85vh; padding: 20px 25px; overflow-y: auto; display: flex; flex-direction: column; }
        .modal-select-content .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .modal-select-content .modal-header h3 { margin: 0; }
        .modal-select-content .close-btn { font-size: 28px; cursor: pointer; color: #4b657a; }
        .modal-select-content .close-btn:hover { color: #1e2a3a; }
        .modal-select-content .filter-row { margin-bottom: 15px; }
        .modal-select-content .table-wrap { overflow-x: auto; flex: 1; }
        .modal-select-content table { width: 100%; border-collapse: collapse; font-size: 14px; }
        .modal-select-content th { background: #1f3a5f; color: white; padding: 8px; text-align: left; }
        .modal-select-content td { padding: 6px; border-bottom: 1px solid #e2e8f0; vertical-align: middle; }
        .modal-select-content tr:hover { background: #f8fafc; }
        .modal-select-content .footer-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; padding-top: 12px; border-top: 1px solid #e2e8f0; flex-wrap: wrap; gap: 10px; }
        .modal-select-content .footer-actions .left { display: flex; align-items: center; gap: 12px; }
        .modal-select-content .footer-actions .left label { font-size: 14px; cursor: pointer; }
        .modal-select-content .footer-actions .right { display: flex; gap: 10px; }
        .pagination { display: flex; gap: 10px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
        .pagination button { padding: 4px 12px; border-radius: 6px; border: 1px solid #cdd8e6; background: white; cursor: pointer; }
        .pagination button:hover:not(:disabled) { background: #e2e8f0; }
        .pagination button:disabled { opacity: 0.5; cursor: not-allowed; }
        .status-badge { padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: 500; display: inline-block; }
        .status-started { background: #d1fae5; color: #065f46; }
        .status-pending { background: #fef3c7; color: #92400e; }
        .score-group { display: flex; align-items: center; gap: 4px; }
        .score-input { width: 40px; padding: 4px 6px; border: 1px solid #cdd8e6; border-radius: 4px; text-align: center; font-size: 14px; }
        .toast { position: fixed; top: 20px; right: 20px; background: #1f3a5f; color: white; padding: 12px 24px; border-radius: 30px; box-shadow: 0 6px 16px rgba(0,0,0,0.2); z-index: 9999; display: none; font-size: 14px; }
        .toast.show { display: block; }
        .result-dialog-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 2000; justify-content: center; align-items: center; backdrop-filter: blur(4px); }
        .result-dialog { background: white; border-radius: 20px; max-width: 500px; width: 90%; padding: 30px 35px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); animation: dialogPop 0.3s ease; text-align: center; }
        @keyframes dialogPop { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .result-dialog .icon { font-size: 48px; margin-bottom: 10px; }
        .result-dialog .title { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
        .result-dialog .summary { font-size: 16px; color: #4b657a; margin-bottom: 12px; }
        .result-dialog .details { text-align: left; background: #f8fafc; border-radius: 8px; padding: 12px 16px; margin: 12px 0; max-height: 150px; overflow-y: auto; font-size: 14px; }
        .result-dialog .details .success-item { color: #0f973d; }
        .result-dialog .details .fail-item { color: #dc2626; }
        .result-dialog .btn-close-dialog { background: #1a3a6b; color: white; border: none; padding: 10px 32px; border-radius: 30px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .result-dialog .btn-close-dialog:hover { background: #0f2a4a; }

        /* VS 符号样式 */
        .vs-large {
            font-weight: 800;
            font-size: 1.2em;
            color: #3b7cff;
            margin: 0 8px;
            text-shadow: 0 0 6px rgba(59,124,255,0.25);
        }
        .vs-symbol-sm {
            font-weight: 700;
            font-size: 0.9em;
            color: #6b7280;
            margin: 0 4px;
        }
        .score-vs {
            display: inline-block;
            min-width: 40px;
            text-align: center;
            font-weight: 600;
        }
    </style>
</head>
<body>
<div class="container">
    {% include '_navbar.html' %}

    <h1>📋 历史预测与赛事</h1>

    <!-- 预测记录部分 -->
    <div class="section-divider">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:15px;">
            <h2 class="section-title">📊 预测记录</h2>
            <div style="display:flex; gap:8px; align-items:center;">
                <button class="action-btn add-btn" id="addMatchBtn" style="padding:6px 14px; font-size:13px;">➕ 手动添加</button>
                <button class="action-btn import-btn" id="importFixturesBtn" style="padding:6px 14px; font-size:13px;">📥 批量导入</button>
            </div>
        </div>
        <div class="filter-row">
            <label>日期筛选：</label>
            <input type="date" id="filter-date">
            <button id="filterBtn">筛选</button>
            <button id="clearFilterBtn">清除筛选</button>
        </div>
        <div id="loading" style="padding:20px; text-align:center;">加载中...</div>
        <div id="tableWrap" style="display:none; overflow-x:auto;">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>日期</th>
                        <th>时间</th>
                        <th>联赛</th>
                        <th>主队</th>
                        <th>客队</th>
                        <th>主队 VS 客队</th>
                        <th>基本面判断</th>
                        <th>结果</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="historyBody"></tbody>
            </table>
        </div>
    </div>

    <!-- 编辑模态框 -->
    <div id="editModal" class="modal-edit">
        <div class="modal-edit-content">
            <h3 id="editTitle">📝 预测/复盘</h3>
            <div id="editFormContainer"></div>
            <div class="btn-group">
                <button class="btn" id="saveEditBtn">💾 保存修改</button>
                <button class="btn btn-secondary" id="cancelEditBtn">取消</button>
            </div>
        </div>
    </div>

    <!-- 批量导入模态框 -->
    <div id="fixtureSelectModal" class="modal-select">
        <div class="modal-select-content">
            <div class="modal-header">
                <h3>📥 从赛事列表导入</h3>
                <span class="close-btn" id="closeFixtureSelect">&times;</span>
            </div>
            <div class="filter-row">
                <label>日期筛选：</label>
                <input type="date" id="fixture-filter-date">
                <button id="fixtureFilterBtn">筛选</button>
                <button id="fixtureClearFilterBtn">清除筛选</button>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th style="width:40px;"><input type="checkbox" id="selectAll"></th>
                            <th>ID</th>
                            <th>日期</th>
                            <th>时间</th>
                            <th>联赛</th>
                            <th>主队</th>
                            <th>客队</th>
                            <th>比分 (主 VS 客)</th>
                            <th>状态</th>
                        </tr>
                    </thead>
                    <tbody id="fixtureSelectBody"></tbody>
                </table>
            </div>
            <div class="pagination" id="fixturePagination" style="display:none;">
                <button id="fixturePrevPageBtn" disabled>上一页</button>
                <span class="page-info" id="fixturePageInfo">第 1 / 1 页</span>
                <button id="fixtureNextPageBtn" disabled>下一页</button>
                <select id="fixturePerPageSelect">
                    <option value="5">5条/页</option>
                    <option value="10">10条/页</option>
                    <option value="20" selected>20条/页</option>
                    <option value="50">50条/页</option>
                </select>
                <span style="font-size:13px; color:#4b657a;">共 <span id="fixtureTotalCount">0</span> 条</span>
            </div>
            <div class="footer-actions">
                <div class="left">
                    <label><input type="checkbox" id="selectAllFooter"> 全选</label>
                    <span style="font-size:13px; color:#6b7280;" id="selectedCount">已选 0 项</span>
                </div>
                <div class="right">
                    <button class="btn btn-secondary" id="cancelImportBtn">取消</button>
                    <button class="btn" id="confirmImportBtn">📥 导入选中</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 导入结果对话框 -->
    <div id="resultDialogOverlay" class="result-dialog-overlay">
        <div class="result-dialog">
            <div class="icon" id="resultIcon">✅</div>
            <div class="title" id="resultTitle">导入完成</div>
            <div class="summary" id="resultSummary">成功 0 项，失败 0 项</div>
            <div class="details" id="resultDetails"></div>
            <button class="btn-close-dialog" id="closeResultDialog">确定</button>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <script>
    (function() {
        // ---------- DOM 引用 ----------
        const tbody = document.getElementById('historyBody');
        const loading = document.getElementById('loading');
        const tableWrap = document.getElementById('tableWrap');
        const filterDate = document.getElementById('filter-date');
        const filterBtn = document.getElementById('filterBtn');
        const clearFilterBtn = document.getElementById('clearFilterBtn');

        const editModal = document.getElementById('editModal');
        const editTitle = document.getElementById('editTitle');
        const editFormContainer = document.getElementById('editFormContainer');
        const saveEditBtn = document.getElementById('saveEditBtn');
        const cancelEditBtn = document.getElementById('cancelEditBtn');

        const importFixturesBtn = document.getElementById('importFixturesBtn');
        const fixtureSelectModal = document.getElementById('fixtureSelectModal');
        const fixtureSelectBody = document.getElementById('fixtureSelectBody');
        const closeFixtureSelect = document.getElementById('closeFixtureSelect');
        const fixtureFilterDate = document.getElementById('fixture-filter-date');
        const fixtureFilterBtn = document.getElementById('fixtureFilterBtn');
        const fixtureClearFilterBtn = document.getElementById('fixtureClearFilterBtn');
        const selectAll = document.getElementById('selectAll');
        const selectAllFooter = document.getElementById('selectAllFooter');
        const selectedCount = document.getElementById('selectedCount');
        const confirmImportBtn = document.getElementById('confirmImportBtn');
        const cancelImportBtn = document.getElementById('cancelImportBtn');

        const fixturePagination = document.getElementById('fixturePagination');
        const fixturePrevPageBtn = document.getElementById('fixturePrevPageBtn');
        const fixtureNextPageBtn = document.getElementById('fixtureNextPageBtn');
        const fixturePageInfo = document.getElementById('fixturePageInfo');
        const fixturePerPageSelect = document.getElementById('fixturePerPageSelect');
        const fixtureTotalCount = document.getElementById('fixtureTotalCount');

        const resultDialogOverlay = document.getElementById('resultDialogOverlay');
        const resultIcon = document.getElementById('resultIcon');
        const resultTitle = document.getElementById('resultTitle');
        const resultSummary = document.getElementById('resultSummary');
        const resultDetails = document.getElementById('resultDetails');
        const closeResultDialog = document.getElementById('closeResultDialog');

        const toast = document.getElementById('toast');
        const addMatchBtn = document.getElementById('addMatchBtn');

        let currentEditId = null;
        let allMatches = [];

        let fixtureCurrentOffset = 0;
        let fixtureCurrentLimit = 20;
        let fixtureCurrentDateFilter = '';
        let fixtureTotalItems = 0;

        const judgmentMap = {
            'home_advantage': '主队占优',
            'away_advantage': '客队占优',
            'equal': '两队实力相当',
            'home_strong': '主队较强优势',
            'away_strong': '客队较强优势',
            'home_dominant': '主队绝对优势',
            'away_dominant': '客队绝对优势',
            'both_weak': '两队菜鸡'
        };

        let toastTimer;
        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // ========== 加载预测记录 ==========
        function loadHistory(date) {
            loading.style.display = 'block';
            tableWrap.style.display = 'none';
            let url = '/api/history';
            if (date) url += '?date=' + date;
            fetch(url)
            .then(res => res.json())
            .then(matches => {
                loading.style.display = 'none';
                tableWrap.style.display = 'block';
                allMatches = matches;
                if (!matches || matches.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;padding:30px;">暂无预测记录</td></tr>';
                    return;
                }
                let html = '';
                matches.forEach(m => {
                    const result = m.result || '未定';
                    let resultHtml = result;
                    if (result === '红') resultHtml = `<span style="color:#dc2626;font-weight:600;">红</span>`;
                    else if (result === '黑') resultHtml = `<span style="color:#1f2937;font-weight:600;">黑</span>`;
                    else if (result === '走盘') resultHtml = `<span style="color:#d97706;font-weight:600;">走盘</span>`;
                    const judgmentDisplay = judgmentMap[m.judgment] || m.judgment || '';
                    // 得分显示为整数
                    const homeScore = Math.round(parseFloat(m.home_score) || 0);
                    const awayScore = Math.round(parseFloat(m.away_score) || 0);
                    const scoreDisplay = `<span class="score-vs">${homeScore}</span> <span class="vs-large">VS</span> <span class="score-vs">${awayScore}</span>`;

                    html += `<tr>
                        <td>${m.id}</td>
                        <td>${m.date || ''}</td>
                        <td>${m.time || ''}</td>
                        <td>${m.league || ''}</td>
                        <td><a href="/?id=${m.id}" class="team-link">${m.home_team}</a></td>
                        <td><a href="/?id=${m.id}" class="team-link">${m.away_team}</a></td>
                        <td>${scoreDisplay}</td>
                        <td>${judgmentDisplay}</td>
                        <td>
                            <select class="result-select" data-id="${m.id}">
                                <option value="">未定</option>
                                <option value="红" ${result==='红'?'selected':''}>红</option>
                                <option value="黑" ${result==='黑'?'selected':''}>黑</option>
                                <option value="走盘" ${result==='走盘'?'selected':''}>走盘</option>
                            </select>
                        </td>
                        <td>
                            <button class="action-btn edit-btn" data-id="${m.id}">📊 预测/复盘</button>
                            <button class="action-btn delete-btn" data-id="${m.id}">🗑️ 删除</button>
                        </td>
                    </tr>`;
                });
                tbody.innerHTML = html;

                document.querySelectorAll('.result-select').forEach(sel => {
                    sel.addEventListener('change', function() {
                        const id = this.dataset.id;
                        const val = this.value;
                        fetch('/api/match/' + id + '/result', {
                            method: 'PUT',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({result: val || null})
                        })
                        .then(res => res.json())
                        .then(res => {
                            if (res.success) loadHistory(filterDate.value);
                            else alert('更新失败: ' + (res.error || '未知错误'));
                        });
                    });
                });

                document.querySelectorAll('.edit-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const id = this.dataset.id;
                        openEditModal(id);
                    });
                });

                document.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const id = this.dataset.id;
                        if (confirm('确定删除该预测记录吗？')) {
                            fetch('/api/match/' + id, { method: 'DELETE' })
                            .then(res => res.json())
                            .then(res => {
                                if (res.success) loadHistory(filterDate.value);
                                else alert('删除失败: ' + (res.error || '未知错误'));
                            });
                        }
                    });
                });
            })
            .catch(err => {
                loading.textContent = '❌ 加载失败: ' + err;
            });
        }

        // ========== 编辑模态框 ==========
        function openEditModal(id) {
            fetch('/api/match/' + id)
            .then(res => res.json())
            .then(data => {
                if (data.error) { alert(data.error); return; }
                currentEditId = id;
                editTitle.textContent = `📝 预测/复盘 - ${data.home_team} vs ${data.away_team}`;
                let html = `<div class="two-col">`;
                // 主队
                html += `<div>
                    <div class="section-title">🏠 主队</div>
                    <div class="form-group"><label>球队名称</label><input type="text" id="edit-home-name" value="${data.home_team}"></div>
                    <div class="form-group"><label>排名</label><input type="number" id="edit-home-rank" value="${data.home_rank}"></div>
                    <div class="form-group"><label>总进球</label><input type="number" id="edit-home-scored" value="${data.home_scored}"></div>
                    <div class="form-group"><label>总失球</label><input type="number" id="edit-home-conceded" value="${data.home_conceded}"></div>
                    <div class="form-group"><label>近3场积分</label><input type="number" id="edit-home-recent" value="${data.home_recent}"></div>
                    <div class="form-group"><label>近3主场胜</label><input type="number" id="edit-home-wins" value="${data.home_wins}"></div>
                    <div class="form-group"><label>近3主场平</label><input type="number" id="edit-home-draws" value="${data.home_draws}"></div>
                    <div class="form-group"><label>近3主场负</label><input type="number" id="edit-home-losses" value="${data.home_losses}"></div>
                    <div class="form-group"><label>关键缺阵</label><input type="number" id="edit-home-injuries" value="${data.home_injuries}"></div>
                    <div class="form-group"><label>战意等级</label><input type="number" id="edit-home-motivation" value="${data.home_motivation}" min="1" max="5"></div>
                    <div class="form-group"><label>身价(M€)</label><input type="number" step="0.1" id="edit-home-value" value="${data.home_value}"></div>
                    <div class="form-group"><label>意外因素</label><input type="text" id="edit-home-unexpected" value="${data.home_unexpected || ''}"></div>
                </div>`;
                // 客队
                html += `<div>
                    <div class="section-title">✈️ 客队</div>
                    <div class="form-group"><label>球队名称</label><input type="text" id="edit-away-name" value="${data.away_team}"></div>
                    <div class="form-group"><label>排名</label><input type="number" id="edit-away-rank" value="${data.away_rank}"></div>
                    <div class="form-group"><label>总进球</label><input type="number" id="edit-away-scored" value="${data.away_scored}"></div>
                    <div class="form-group"><label>总失球</label><input type="number" id="edit-away-conceded" value="${data.away_conceded}"></div>
                    <div class="form-group"><label>近3场积分</label><input type="number" id="edit-away-recent" value="${data.away_recent}"></div>
                    <div class="form-group"><label>近3客场胜</label><input type="number" id="edit-away-wins" value="${data.away_wins}"></div>
                    <div class="form-group"><label>近3客场平</label><input type="number" id="edit-away-draws" value="${data.away_draws}"></div>
                    <div class="form-group"><label>近3客场负</label><input type="number" id="edit-away-losses" value="${data.away_losses}"></div>
                    <div class="form-group"><label>关键缺阵</label><input type="number" id="edit-away-injuries" value="${data.away_injuries}"></div>
                    <div class="form-group"><label>战意等级</label><input type="number" id="edit-away-motivation" value="${data.away_motivation}" min="1" max="5"></div>
                    <div class="form-group"><label>身价(M€)</label><input type="number" step="0.1" id="edit-away-value" value="${data.away_value}"></div>
                    <div class="form-group"><label>意外因素</label><input type="text" id="edit-away-unexpected" value="${data.away_unexpected || ''}"></div>
                </div>`;
                html += `</div>`;
                // 日期、时间、联赛
                html += `<div class="form-group"><label>日期</label><input type="date" id="edit-date" value="${data.date || ''}"></div>`;
                html += `<div class="form-group"><label>时间</label><input type="text" id="edit-time" value="${data.time || ''}" placeholder="如 19:30"></div>`;
                html += `<div class="form-group"><label>联赛</label><input type="text" id="edit-league" value="${data.league || ''}"></div>`;
                // 预测结果：主队得分和客队得分改为整数
                html += `<div class="section-title">📊 预测结果</div>`;
                html += `<div class="form-group"><label>主队得分</label><input type="number" step="1" id="edit-home-score" value="${Math.round(data.home_score)}"></div>`;
                html += `<div class="form-group"><label>客队得分</label><input type="number" step="1" id="edit-away-score" value="${Math.round(data.away_score)}"></div>`;
                html += `<div class="form-group"><label>主胜概率</label><input type="number" step="0.01" id="edit-home-prob" value="${data.home_prob}"></div>`;
                html += `<div class="form-group"><label>平局概率</label><input type="number" step="0.01" id="edit-draw-prob" value="${data.draw_prob}"></div>`;
                html += `<div class="form-group"><label>客胜概率</label><input type="number" step="0.01" id="edit-away-prob" value="${data.away_prob}"></div>`;
                // 判断和结果
                html += `<div class="form-group"><label>基本面判断</label>
                    <select id="edit-judgment">
                        <option value="home_advantage" ${data.judgment==='home_advantage'?'selected':''}>主队占优</option>
                        <option value="away_advantage" ${data.judgment==='away_advantage'?'selected':''}>客队占优</option>
                        <option value="equal" ${data.judgment==='equal'?'selected':''}>两队实力相当</option>
                        <option value="home_strong" ${data.judgment==='home_strong'?'selected':''}>主队较强优势</option>
                        <option value="away_strong" ${data.judgment==='away_strong'?'selected':''}>客队较强优势</option>
                        <option value="home_dominant" ${data.judgment==='home_dominant'?'selected':''}>主队绝对优势</option>
                        <option value="away_dominant" ${data.judgment==='away_dominant'?'selected':''}>客队绝对优势</option>
                        <option value="both_weak" ${data.judgment==='both_weak'?'selected':''}>两队菜鸡</option>
                    </select>
                </div>`;
                html += `<div class="form-group"><label>结果</label>
                    <select id="edit-result">
                        <option value="">未定</option>
                        <option value="红" ${data.result==='红'?'selected':''}>红</option>
                        <option value="黑" ${data.result==='黑'?'selected':''}>黑</option>
                        <option value="走盘" ${data.result==='走盘'?'selected':''}>走盘</option>
                    </select>
                </div>`;
                editFormContainer.innerHTML = html;
                editModal.style.display = 'flex';
                saveEditBtn.dataset.id = id;
            });
        }

        function saveEdit() {
            const id = saveEditBtn.dataset.id;
            const data = {
                date: document.getElementById('edit-date').value || '',
                time: document.getElementById('edit-time').value || '',
                league: document.getElementById('edit-league').value || '',
                home_team: document.getElementById('edit-home-name').value,
                away_team: document.getElementById('edit-away-name').value,
                home_rank: parseInt(document.getElementById('edit-home-rank').value) || 0,
                home_scored: parseInt(document.getElementById('edit-home-scored').value) || 0,
                home_conceded: parseInt(document.getElementById('edit-home-conceded').value) || 0,
                home_recent: parseInt(document.getElementById('edit-home-recent').value) || 0,
                home_wins: parseInt(document.getElementById('edit-home-wins').value) || 0,
                home_draws: parseInt(document.getElementById('edit-home-draws').value) || 0,
                home_losses: parseInt(document.getElementById('edit-home-losses').value) || 0,
                home_injuries: parseInt(document.getElementById('edit-home-injuries').value) || 0,
                home_motivation: parseInt(document.getElementById('edit-home-motivation').value) || 3,
                home_value: parseFloat(document.getElementById('edit-home-value').value) || 0,
                away_rank: parseInt(document.getElementById('edit-away-rank').value) || 0,
                away_scored: parseInt(document.getElementById('edit-away-scored').value) || 0,
                away_conceded: parseInt(document.getElementById('edit-away-conceded').value) || 0,
                away_recent: parseInt(document.getElementById('edit-away-recent').value) || 0,
                away_wins: parseInt(document.getElementById('edit-away-wins').value) || 0,
                away_draws: parseInt(document.getElementById('edit-away-draws').value) || 0,
                away_losses: parseInt(document.getElementById('edit-away-losses').value) || 0,
                away_injuries: parseInt(document.getElementById('edit-away-injuries').value) || 0,
                away_motivation: parseInt(document.getElementById('edit-away-motivation').value) || 3,
                away_value: parseFloat(document.getElementById('edit-away-value').value) || 0,
                home_unexpected: document.getElementById('edit-home-unexpected').value || '',
                away_unexpected: document.getElementById('edit-away-unexpected').value || '',
                home_score: parseInt(document.getElementById('edit-home-score').value) || 0,
                away_score: parseInt(document.getElementById('edit-away-score').value) || 0,
                home_prob: parseFloat(document.getElementById('edit-home-prob').value) || 0,
                draw_prob: parseFloat(document.getElementById('edit-draw-prob').value) || 0,
                away_prob: parseFloat(document.getElementById('edit-away-prob').value) || 0,
                judgment: document.getElementById('edit-judgment').value,
                result: document.getElementById('edit-result').value || null
            };
            fetch('/api/match/' + id, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            })
            .then(res => res.json())
            .then(res => {
                if (res.success) {
                    editModal.style.display = 'none';
                    loadHistory(filterDate.value);
                    alert('✅ 修改成功！');
                } else {
                    alert('❌ 修改失败: ' + (res.error || '未知错误'));
                }
            });
        }

        function closeEditModal() {
            editModal.style.display = 'none';
        }

        // ========== 批量导入相关 ==========
        function isMatchStarted(dateStr, timeStr) {
            if (!dateStr) return false;
            if (!timeStr || timeStr.trim() === '') return false;
            try {
                const matchTime = new Date(dateStr + 'T' + timeStr.trim() + ':00');
                const now = new Date();
                return (now - matchTime) > 10800000;
            } catch (e) { return false; }
        }

        function loadFixtureSelectData(date, limit, offset) {
            if (date === undefined) date = fixtureCurrentDateFilter;
            if (limit === undefined) limit = fixtureCurrentLimit;
            if (offset === undefined) offset = fixtureCurrentOffset;

            let url = `/api/fixtures?limit=${limit}&offset=${offset}`;
            if (date) url += '&date=' + date;

            fetch(url)
            .then(res => res.json())
            .then(data => {
                const fixtures = data.data || [];
                fixtureTotalItems = data.total || 0;
                fixtureCurrentLimit = data.limit || limit;
                fixtureCurrentOffset = data.offset || offset;

                if (fixtures.length === 0) {
                    fixtureSelectBody.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:20px;">暂无赛事</td></tr>';
                    fixturePagination.style.display = 'none';
                    return;
                }

                let html = '';
                fixtures.forEach(item => {
                    let homeScore = parseInt(item.score ? item.score.split(':')[0] : 0) || 0;
                    let awayScore = parseInt(item.score ? item.score.split(':')[1] : 0) || 0;
                    homeScore = Math.abs(homeScore);
                    awayScore = Math.abs(awayScore);
                    const scoreDisplay = (homeScore || awayScore) ? `${homeScore} <span class="vs-symbol-sm">VS</span> ${awayScore}` : '';
                    const started = isMatchStarted(item.date, item.time);
                    const statusClass = started ? 'status-started' : 'status-pending';
                    const statusText = started ? '开赛' : '待定';
                    html += `<tr>
                        <td><input type="checkbox" class="fixture-checkbox" data-date="${item.date}" data-time="${item.time}" data-league="${item.league}" data-home="${item.home_team}" data-away="${item.away_team}"></td>
                        <td>${item.id}</td>
                        <td>${item.date}</td>
                        <td>${item.time || ''}</td>
                        <td>${item.league}</td>
                        <td>${item.home_team}</td>
                        <td>${item.away_team}</td>
                        <td>${scoreDisplay}</td>
                        <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                    </tr>`;
                });
                fixtureSelectBody.innerHTML = html;

                updateFixturePagination();

                document.querySelectorAll('#fixtureSelectBody .fixture-checkbox').forEach(cb => {
                    cb.addEventListener('change', updateSelectedCount);
                });

                const allCheckboxes = document.querySelectorAll('#fixtureSelectBody .fixture-checkbox');
                const anyChecked = allCheckboxes.length > 0 && allCheckboxes.length === document.querySelectorAll('#fixtureSelectBody .fixture-checkbox:checked').length;
                selectAll.checked = anyChecked;
                selectAllFooter.checked = anyChecked;
                updateSelectedCount();
            })
            .catch(err => {
                fixtureSelectBody.innerHTML = `<tr><td colspan="9" style="text-align:center;color:red;">加载失败: ${err.message}</td></tr>`;
            });
        }

        function updateFixturePagination() {
            const totalPages = Math.ceil(fixtureTotalItems / fixtureCurrentLimit) || 1;
            const currentPage = Math.floor(fixtureCurrentOffset / fixtureCurrentLimit) + 1;
            fixturePageInfo.textContent = `第 ${currentPage} / ${totalPages} 页`;
            fixtureTotalCount.textContent = fixtureTotalItems;
            fixturePrevPageBtn.disabled = fixtureCurrentOffset === 0;
            fixtureNextPageBtn.disabled = fixtureCurrentOffset + fixtureCurrentLimit >= fixtureTotalItems;
            fixturePagination.style.display = 'flex';
        }

        function goToFixturePage(offset) {
            if (offset < 0) offset = 0;
            if (offset >= fixtureTotalItems) offset = Math.max(0, fixtureTotalItems - fixtureCurrentLimit);
            fixtureCurrentOffset = offset;
            loadFixtureSelectData(fixtureCurrentDateFilter, fixtureCurrentLimit, fixtureCurrentOffset);
        }

        function updateSelectedCount() {
            const checked = document.querySelectorAll('#fixtureSelectBody .fixture-checkbox:checked').length;
            selectedCount.textContent = `已选 ${checked} 项`;
            const allCbs = document.querySelectorAll('#fixtureSelectBody .fixture-checkbox');
            const allChecked = allCbs.length > 0 && allCbs.length === document.querySelectorAll('#fixtureSelectBody .fixture-checkbox:checked').length;
            selectAll.checked = allChecked;
            selectAllFooter.checked = allChecked;
        }

        function setAllChecked(checked) {
            document.querySelectorAll('#fixtureSelectBody .fixture-checkbox').forEach(cb => cb.checked = checked);
            updateSelectedCount();
        }

        function confirmImport() {
            const checkedBoxes = document.querySelectorAll('#fixtureSelectBody .fixture-checkbox:checked');
            if (checkedBoxes.length === 0) {
                showToast('请至少选择一项赛事');
                return;
            }

            const items = [];
            checkedBoxes.forEach(cb => {
                items.push({
                    date: cb.dataset.date || '',
                    time: cb.dataset.time || '',
                    league: cb.dataset.league || '',
                    home: cb.dataset.home || '',
                    away: cb.dataset.away || ''
                });
            });

            let successCount = 0;
            let failCount = 0;
            const details = [];

            function importNext(index) {
                if (index >= items.length) {
                    showResultDialog(successCount, failCount, details);
                    loadHistory(filterDate.value);
                    fixtureSelectModal.style.display = 'none';
                    return;
                }
                const item = items[index];
                if (allMatches.some(m => m.date === item.date && m.home_team === item.home && m.away_team === item.away)) {
                    details.push({ text: `${item.home} vs ${item.away} (${item.date}) 已存在，跳过`, success: false });
                    failCount++;
                    importNext(index + 1);
                    return;
                }
                if (!item.date || !item.home || !item.away) {
                    details.push({ text: `${item.home || '?'} vs ${item.away || '?'} 数据不完整，跳过`, success: false });
                    failCount++;
                    importNext(index + 1);
                    return;
                }
                const payload = {
                    date: item.date,
                    time: item.time,
                    league: item.league,
                    home_team: item.home,
                    away_team: item.away,
                    home_rank: 10,
                    home_scored: 0,
                    home_conceded: 0,
                    home_recent: 0,
                    home_wins: 0,
                    home_draws: 0,
                    home_losses: 0,
                    home_injuries: 0,
                    home_motivation: 3,
                    home_value: 0,
                    away_rank: 10,
                    away_scored: 0,
                    away_conceded: 0,
                    away_recent: 0,
                    away_wins: 0,
                    away_draws: 0,
                    away_losses: 0,
                    away_injuries: 0,
                    away_motivation: 3,
                    away_value: 0,
                    home_unexpected: '',
                    away_unexpected: '',
                    home_score: 0,
                    away_score: 0,
                    home_prob: 0.33,
                    draw_prob: 0.34,
                    away_prob: 0.33,
                    judgment: 'equal'
                };
                fetch('/api/save', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                })
                .then(res => res.json())
                .then(res => {
                    if (res.success) {
                        successCount++;
                        details.push({ text: `${item.home} vs ${item.away} (${item.date}) 导入成功，ID: ${res.id}`, success: true });
                    } else {
                        failCount++;
                        details.push({ text: `${item.home} vs ${item.away} (${item.date}) 失败: ${res.error || '未知错误'}`, success: false });
                    }
                    importNext(index + 1);
                })
                .catch(err => {
                    failCount++;
                    details.push({ text: `${item.home} vs ${item.away} (${item.date}) 请求出错: ${err.message}`, success: false });
                    importNext(index + 1);
                });
            }

            fixtureSelectModal.style.display = 'none';
            importNext(0);
        }

        function showResultDialog(success, fail, details) {
            resultIcon.textContent = fail === 0 ? '✅' : '⚠️';
            resultTitle.textContent = fail === 0 ? '全部导入成功！' : '导入完成（部分失败）';
            resultSummary.textContent = `成功 ${success} 项，失败 ${fail} 项`;
            let detailHtml = '';
            details.forEach(d => {
                const cls = d.success ? 'success-item' : 'fail-item';
                detailHtml += `<div class="${cls}">${d.text}</div>`;
            });
            resultDetails.innerHTML = detailHtml || '<div style="color:#6b7280;">无详细信息</div>';
            resultDialogOverlay.style.display = 'flex';
        }

        closeResultDialog.addEventListener('click', function() {
            resultDialogOverlay.style.display = 'none';
        });
        resultDialogOverlay.addEventListener('click', function(e) {
            if (e.target === this) resultDialogOverlay.style.display = 'none';
        });

        // ========== 事件绑定 ==========

        importFixturesBtn.addEventListener('click', function() {
            fixtureSelectModal.style.display = 'flex';
            loadFixtureSelectData();
        });

        closeFixtureSelect.addEventListener('click', function() {
            fixtureSelectModal.style.display = 'none';
        });
        cancelImportBtn.addEventListener('click', function() {
            fixtureSelectModal.style.display = 'none';
        });
        window.addEventListener('click', function(e) {
            if (e.target === fixtureSelectModal) fixtureSelectModal.style.display = 'none';
        });

        fixtureFilterBtn.addEventListener('click', function() {
            fixtureCurrentDateFilter = fixtureFilterDate.value;
            fixtureCurrentOffset = 0;
            loadFixtureSelectData(fixtureCurrentDateFilter, fixtureCurrentLimit, 0);
        });
        fixtureClearFilterBtn.addEventListener('click', function() {
            fixtureFilterDate.value = '';
            fixtureCurrentDateFilter = '';
            fixtureCurrentOffset = 0;
            loadFixtureSelectData('', fixtureCurrentLimit, 0);
        });

        selectAll.addEventListener('change', function() { setAllChecked(this.checked); });
        selectAllFooter.addEventListener('change', function() { setAllChecked(this.checked); });

        fixturePrevPageBtn.addEventListener('click', function() {
            goToFixturePage(fixtureCurrentOffset - fixtureCurrentLimit);
        });
        fixtureNextPageBtn.addEventListener('click', function() {
            goToFixturePage(fixtureCurrentOffset + fixtureCurrentLimit);
        });
        fixturePerPageSelect.addEventListener('change', function() {
            fixtureCurrentLimit = parseInt(this.value);
            fixtureCurrentOffset = 0;
            loadFixtureSelectData(fixtureCurrentDateFilter, fixtureCurrentLimit, 0);
        });

        confirmImportBtn.addEventListener('click', confirmImport);
        cancelImportBtn.addEventListener('click', function() {
            fixtureSelectModal.style.display = 'none';
        });

        filterBtn.addEventListener('click', function() { loadHistory(filterDate.value); });
        clearFilterBtn.addEventListener('click', function() { filterDate.value = ''; loadHistory(''); });

        addMatchBtn.addEventListener('click', function() {
            const payload = {
                date: '',
                time: '',
                league: '',
                home_team: '主队',
                away_team: '客队',
                home_rank: 10,
                home_scored: 0,
                home_conceded: 0,
                home_recent: 0,
                home_wins: 0,
                home_draws: 0,
                home_losses: 0,
                home_injuries: 0,
                home_motivation: 3,
                home_value: 0,
                away_rank: 10,
                away_scored: 0,
                away_conceded: 0,
                away_recent: 0,
                away_wins: 0,
                away_draws: 0,
                away_losses: 0,
                away_injuries: 0,
                away_motivation: 3,
                away_value: 0,
                home_unexpected: '',
                away_unexpected: '',
                home_score: 0,
                away_score: 0,
                home_prob: 0.33,
                draw_prob: 0.34,
                away_prob: 0.33,
                judgment: 'equal'
            };
            fetch('/api/save', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(res => {
                if (res.success) {
                    showToast('✅ 空记录已创建，ID: ' + res.id);
                    window.location.href = '/?id=' + res.id;
                } else {
                    showToast('❌ 创建失败: ' + (res.error || '未知错误'));
                }
            })
            .catch(err => showToast('❌ 请求出错: ' + err.message));
        });

        cancelEditBtn.addEventListener('click', closeEditModal);
        window.addEventListener('click', function(e) {
            if (e.target === editModal) closeEditModal();
        });
        saveEditBtn.addEventListener('click', saveEdit);

        loadHistory('');
    })();
    </script>
</body>
</html>
