<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>红单明细</title>
    <style>
        /* 样式与之前完全相同，仅增加表头复选框列宽 */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            background: #f0f4f8;
            color: #1e2a3a;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.1);
            padding: 30px 35px;
        }
        .top-nav {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            background: #f1f5f9;
            padding: 10px 18px;
            border-radius: 30px;
        }
        .top-nav a {
            text-decoration: none;
            color: #1f3a5f;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 16px;
        }
        .top-nav a.active { background: #1a3a6b; color: white; }
        .top-nav a:hover { background: #d1d9e6; }
        h1 { margin-bottom: 20px; }
        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .back-link {
            color: #1a3a6b;
            text-decoration: none;
            font-weight: 500;
        }
        .back-link:hover { text-decoration: underline; }
        .delete-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        .delete-btn:hover { background: #b91c1c; }

        .detail-table {
            table-layout: fixed;
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        .detail-table th,
        .detail-table td {
            padding: 6px 4px;
            border-bottom: 1px solid #e2e8f0;
            word-break: break-word;
            white-space: normal;
        }
        .detail-table th {
            background: #1f3a5f;
            color: white;
            text-align: left;
            white-space: nowrap;
        }
        .detail-table tr:hover { background: #f8fafc; }

        /* 列宽调整，增加复选框列 */
        .detail-table th:nth-child(1) { width: 40px; }
        .detail-table th:nth-child(2) { width: 60px; }
        .detail-table th:nth-child(3) { width: 90px; }
        .detail-table th:nth-child(4) { width: 150px; }
        .detail-table th:nth-child(5) { width: 80px; }
        .detail-table th:nth-child(6) { width: 80px; }
        .detail-table th:nth-child(7) { width: 80px; }
        .detail-table th:nth-child(8) { width: 110px; }
        .detail-table th:nth-child(9) { width: 60px; }
        .detail-table th:nth-child(10) { width: 160px; }

        .loading-text { padding: 30px; text-align: center; color: #6b7280; }
        .pagination {
            display: flex;
            gap: 6px;
            align-items: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .pagination button, .pagination .page-num {
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid #cdd8e6;
            background: white;
            cursor: pointer;
            font-size: 14px;
            min-width: 36px;
            text-align: center;
        }
        .pagination button:hover:not(:disabled), .pagination .page-num:hover { background: #e2e8f0; }
        .pagination button:disabled { opacity: 0.5; cursor: not-allowed; }
        .pagination .page-num.active { background: #1a3a6b; color: white; border-color: #1a3a6b; }
        .pagination .ellipsis { padding: 6px 8px; color: #6b7280; }

        .review-input {
            width: 100%;
            padding: 4px 6px;
            border: 1px solid #cdd8e6;
            border-radius: 4px;
            font-size: 13px;
            background: #fafbfc;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }
        .review-input:focus {
            outline: none;
            border-color: #3b7cff;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(59,124,255,0.15);
        }
        .review-input.saving { opacity: 0.6; background: #f0f4ff; }
        .save-tag {
            font-size: 11px;
            color: #4b7a3b;
            margin-left: 4px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .save-tag.show { opacity: 1; }

        @media (max-width: 700px) {
            .container { padding: 16px; }
            .detail-table { font-size: 12px; table-layout: auto; }
            .detail-table th, .detail-table td { padding: 4px 3px; }
            .detail-table th:nth-child(n) { width: auto; }
            .review-input { font-size: 12px; }
        }
    </style>
</head>
<body>
    <div class="container">
        {% include '_navbar.html' %}
        <div class="header-actions">
            <a href="/stats" class="back-link">⬅ 返回统计页</a>
            <button class="delete-btn" id="deleteSelectedBtn">🗑️ 删除选中</button>
        </div>
        <h1>🔴 走单明细</h1>
        <div id="loading" class="loading-text">加载中...</div>
        <div id="tableWrap" style="display:none;">
            <table class="detail-table">
                <thead>
                    <tr>
                        <th><input type="checkbox" id="selectAll" /></th>
                        <th>ID</th>
                        <th>联赛</th>
                        <th>主队 VS 客队</th>
                        <th>初01</th>
                        <th>初02</th>
                        <th>基本面评分</th>
                        <th>基本面判断</th>
                        <th>结果</th>
                        <th>复盘</th>
                    </tr>
                </thead>
                <tbody id="detailBody"></tbody>
            </table>
        </div>
        <div class="pagination" id="pagination" style="display:none;">
            <button id="prevPageBtn" disabled>上一页</button>
            <span id="pageNumbers"></span>
            <button id="nextPageBtn" disabled>下一页</button>
            <select id="perPageSelect" style="margin-left:10px;padding:4px 8px;border-radius:6px;border:1px solid #cdd8e6;">
                <option value="10">10条/页</option>
                <option value="20" selected>20条/页</option>
                <option value="50">50条/页</option>
                <option value="100">100条/页</option>
            </select>
            <span style="font-size:13px; color:#4b657a; margin-left:8px;">共 <span id="totalCount">0</span> 条</span>
        </div>
    </div>

    <script>
        // 设置结果类型，供公共 JS 使用
        window.RESULT_TYPE = '走盘';
    </script>
    <script src="/static/js/detail_list.js"></script>
</body>
</html>
