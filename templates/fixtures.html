<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>赛事列表</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/css/fixtures.css">
</head>
<body>
<div class="container">
    {% include '_navbar.html' %}

    <h1>📅 赛事列表</h1>

    <div class="fetch-area">
        <label>📡 获取赛事</label>
        <input type="date" id="fetch-date">
        <label class="checkbox-label">
            <input type="checkbox" id="include-finished"> 包含已完赛
        </label>
        <button class="btn-success" id="fetchFixturesBtn">抓取</button>
    </div>

    <div class="filter-row">
        <label>日期筛选：</label>
        <input type="date" id="filter-date">
		<label>联赛：</label>
<select id="filter-league">
    <option value="">全部联赛</option>
</select>
        <button id="filterBtn">筛选</button>
        <button id="clearFilterBtn">清除筛选</button>
        <button class="add-btn" id="addBtn">➕ 手动添加</button>
    </div>

    <div id="loading" style="padding:20px; text-align:center;">加载中...</div>
    <div id="tableWrap" style="display:none; overflow-x:auto;">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>日期</th>
                    <th>时间</th>
                    <th>联赛</th>
                    <th>主队 VS 客队</th>
                    <th>比分</th>
                    <th>状态</th>
                    <th>已分析</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="fixturesBody"></tbody>
        </table>
    </div>

    <div class="pagination" id="pagination" style="display:none;">
        <button id="prevPageBtn" disabled>上一页</button>
        <span id="pageNumbers"></span>
        <button id="nextPageBtn" disabled>下一页</button>
        <select id="perPageSelect" style="margin-left:10px;padding:4px 8px;border-radius:6px;border:1px solid #cdd8e6;">
            <option value="10">10条/页</option>
            <option value="20" selected>20条/页</option>
            <option value="50">50条/页</option>
            <option value="100">100条/页</option>
        </select>
        <span style="font-size:13px; color:#4b657a; margin-left:8px;">共 <span id="totalCount">0</span> 条</span>
    </div>
</div>

<!-- 编辑/添加模态框 -->
<div id="editModal" class="modal-edit">
    <div class="modal-edit-content">
        <h3 id="editTitle">编辑赛事</h3>
        <div id="editFormContainer">
            <div class="form-group"><label>日期</label><input type="date" id="edit-date"></div>
            <div class="form-group"><label>时间</label><input type="text" id="edit-time" placeholder="如 19:30"></div>
            <div class="form-group"><label>联赛</label><input type="text" id="edit-league"></div>
            <div class="form-group"><label>主队</label><input type="text" id="edit-home"></div>
            <div class="form-group"><label>客队</label><input type="text" id="edit-away"></div>
            <div class="form-group"><label>比分</label>
                <div class="score-group">
                    <input type="text" id="edit-home-score" class="score-input" placeholder="0">
                    <span class="score-separator">:</span>
                    <input type="text" id="edit-away-score" class="score-input" placeholder="0">
                </div>
            </div>
        </div>
        <div class="btn-group">
            <button class="btn" id="saveEditBtn">保存</button>
            <button class="btn btn-secondary" id="cancelEditBtn">取消</button>
        </div>
    </div>
</div>

<!-- Toast -->
<div id="toast" class="toast"></div>

<script src="/static/js/fixtures.js"></script>
</body>
</html>
