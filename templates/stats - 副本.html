<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>统计</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            background: #f0f4f8;
            color: #1e2a3a;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.1);
            padding: 30px 35px;
        }
        .top-nav {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            background: #f1f5f9;
            padding: 10px 18px;
            border-radius: 30px;
        }
        .top-nav a {
            text-decoration: none;
            color: #1f3a5f;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 16px;
        }
        .top-nav a.active {
            background: #1a3a6b;
            color: white;
        }
        .top-nav a:hover { background: #d1d9e6; }
        h1 { margin-bottom: 20px; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: #f8fafc;
            padding: 18px;
            border-radius: 14px;
            text-align: center;
            border: 1px solid #e2e8f0;
        }
        .stat-card .number {
            font-size: 32px;
            font-weight: 700;
            color: #0a2540;
        }
        .stat-card .label {
            font-size: 14px;
            color: #4b657a;
        }
        .stat-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        .stat-table th {
            background: #1f3a5f;
            color: white;
            padding: 10px;
            text-align: left;
        }
        .stat-table td {
            padding: 8px 10px;
            border-bottom: 1px solid #e2e8f0;
        }
        .stat-table tr:hover { background: #f8fafc; }
        h2 { margin-top: 30px; font-size: 20px; }
        .bar-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 4px 0;
        }
        .bar-label { width: 100px; font-size: 14px; }
        .bar-track {
            flex: 1;
            height: 20px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            background: #2563eb;
            border-radius: 10px;
            transition: width 0.3s;
        }
        .bar-fill.red { background: #dc2626; }
        .bar-fill.black { background: #1f2937; }
        .bar-fill.draw { background: #d97706; }
        .bar-value { width: 60px; text-align: right; font-size: 14px; }
    </style>
</head>
<body>
<div class="container">
    {% include '_navbar.html' %}

    <h1>📈 数据统计</h1>
    <div id="statsLoading" style="padding:20px; text-align:center;">加载中...</div>
    <div id="statsContent" style="display:none;">
        <!-- 总览 -->
        <div class="stats-grid" id="overviewCards"></div>

        <!-- 结果分布 -->
        <h2>📊 结果分布</h2>
        <div id="resultDistribution"></div>

        <!-- 基本面判断 vs 结果 -->
        <h2>📋 各基本面判断下的结果统计</h2>
        <div id="judgmentStats"></div>
    </div>
</div>

<script>
function loadStats() {
    fetch('/api/stats')
    .then(res => res.json())
    .then(data => {
        document.getElementById('statsLoading').style.display = 'none';
        document.getElementById('statsContent').style.display = 'block';

        // 总览卡片
        const overview = document.getElementById('overviewCards');
        const total = data.total || 0;
        const resultCounts = data.result_counts || [];
        const red = resultCounts.find(r => r.result === '红')?.cnt || 0;
        const black = resultCounts.find(r => r.result === '黑')?.cnt || 0;
        const draw = resultCounts.find(r => r.result === '走盘')?.cnt || 0;
        const unset = total - red - black - draw;
        overview.innerHTML = `
            <div class="stat-card"><div class="number">${total}</div><div class="label">总场次</div></div>
            <div class="stat-card"><div class="number" style="color:#dc2626;">${red}</div><div class="label">红 (命中)</div></div>
            <div class="stat-card"><div class="number" style="color:#1f2937;">${black}</div><div class="label">黑 (未中)</div></div>
            <div class="stat-card"><div class="number" style="color:#d97706;">${draw}</div><div class="label">走盘</div></div>
            <div class="stat-card"><div class="number" style="color:#6b7280;">${unset}</div><div class="label">未定</div></div>
        `;

        // 结果分布条形图
        const distDiv = document.getElementById('resultDistribution');
        const maxVal = Math.max(red, black, draw, 1);
        distDiv.innerHTML = `
            <div class="bar-container"><div class="bar-label">红</div><div class="bar-track"><div class="bar-fill red" style="width:${(red/maxVal)*100}%;"></div></div><div class="bar-value">${red}</div></div>
            <div class="bar-container"><div class="bar-label">黑</div><div class="bar-track"><div class="bar-fill black" style="width:${(black/maxVal)*100}%;"></div></div><div class="bar-value">${black}</div></div>
            <div class="bar-container"><div class="bar-label">走盘</div><div class="bar-track"><div class="bar-fill draw" style="width:${(draw/maxVal)*100}%;"></div></div><div class="bar-value">${draw}</div></div>
        `;

        // 基本面判断统计
        const jStats = data.judgment_stats || [];
        const jDiv = document.getElementById('judgmentStats');
        if (jStats.length === 0) {
            jDiv.innerHTML = '<p style="color:#6b7280;">暂无数据</p>';
            return;
        }
        // 映射判断中文
        const judgmentMap = {
            'home_advantage': '主队占优',
            'away_advantage': '客队占优',
            'equal': '两队实力相当',
            'home_strong': '主队较强优势',
            'away_strong': '客队较强优势',
            'home_dominant': '主队绝对优势',
            'away_dominant': '客队绝对优势',
            'both_weak': '两队菜鸡'
        };
        let html = `<table class="stat-table"><thead><tr><th>基本面判断</th><th>总场次</th><th>红</th><th>黑</th><th>走盘</th><th>胜率 (红/总)</th></tr></thead><tbody>`;
        jStats.forEach(item => {
            const label = judgmentMap[item.judgment] || item.judgment;
            const totalJ = item.total || 0;
            const redJ = item.red || 0;
            const blackJ = item.black || 0;
            const drawJ = item.draw || 0;
            const rate = totalJ > 0 ? ((redJ / totalJ) * 100).toFixed(1) : '0.0';
            html += `<tr><td>${label}</td><td>${totalJ}</td><td style="color:#dc2626;">${redJ}</td><td style="color:#1f2937;">${blackJ}</td><td style="color:#d97706;">${drawJ}</td><td>${rate}%</td></tr>`;
        });
        html += `</tbody></table>`;
        jDiv.innerHTML = html;
    })
    .catch(err => {
        document.getElementById('statsLoading').textContent = '❌ 加载失败: ' + err;
    });
}

window.addEventListener('load', loadStats);
</script>
</body>
</html>
