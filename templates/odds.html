<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>赔率预测</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        /* 通用样式 */
        .action-btn { padding: 4px 10px; border-radius: 6px; border: none; cursor: pointer; font-size: 13px; margin-right: 4px; }
        .edit-btn { background: #3b7cff; color: white; }
        .edit-btn:hover { background: #2563eb; }
        .delete-btn { background: #dc2626; color: white; }
        .delete-btn:hover { background: #b91c1c; }
        .add-btn { background: #d97706; color: white; }
        .add-btn:hover { background: #b45309; }
        .batch-delete-btn { background: #dc2626; color: white; }
        .batch-delete-btn:hover { background: #b91c1c; }
        .odds-analysis-btn { background: #3b7cff; color: white; }
        .odds-analysis-btn:hover { background: #2563eb; }
        .filter-row { display: flex; gap: 15px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
        .filter-row input,
        .filter-row button { padding: 8px 14px; border-radius: 8px; border: 1px solid #cdd8e6; font-size: 14px; }
        .filter-row button { background: #1a3a6b; color: white; border: none; cursor: pointer; }
        .filter-row button:hover { background: #0f2a4a; }
        .team-link { color: #1a3a6b; text-decoration: none; font-weight: 500; cursor: pointer; }
        .team-link:hover { text-decoration: underline; color: #3b7cff; }
        .section-divider { margin: 30px 0 20px; border-top: 2px solid #e2e8f0; padding-top: 20px; }
        .section-title { font-size: 20px; font-weight: 600; color: #1f3a5f; margin: 0; }

        /* 模态框样式（共用） */
        .modal-edit { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal-edit-content { background: white; border-radius: 16px; max-width: 820px; width: 95%; max-height: 90vh; padding: 20px 25px; overflow-y: auto; }
        .modal-edit-content .form-group { margin-bottom: 8px; display: flex; align-items: center; }
        .modal-edit-content .form-group input,
        .modal-edit-content .form-group select { flex: 1; padding: 6px 10px; border: 1px solid #cdd8e6; border-radius: 6px; font-size: 13px; }
        .modal-edit-content .info-row { display: flex; padding: 6px 0; border-bottom: 1px solid #f0f2f5; }
        .modal-edit-content .info-label { width: 120px; font-weight: 500; font-size: 14px; color: #4b657a; }
        .modal-edit-content .info-value { flex: 1; color: #1f2937; }

        /* 分页 */
        .pagination { display: flex; gap: 6px; align-items: center; margin-top: 20px; flex-wrap: wrap; }
        .pagination button,
        .pagination .page-num { padding: 6px 12px; border-radius: 6px; border: 1px solid #cdd8e6; background: white; cursor: pointer; font-size: 14px; min-width: 36px; text-align: center; }
        .pagination button:hover:not(:disabled),
        .pagination .page-num:hover { background: #e2e8f0; }
        .pagination button:disabled { opacity: 0.5; cursor: not-allowed; }
        .pagination .page-num.active { background: #1a3a6b; color: white; border-color: #1a3a6b; }
        .pagination .ellipsis { padding: 6px 8px; color: #6b7280; }

        /* Toast */
        .toast { position: fixed; top: 20px; right: 20px; background: #1f3a5f; color: white; padding: 12px 24px; border-radius: 30px; box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2); z-index: 9999; display: none; font-size: 14px; }
        .toast.show { display: block; }

        /* 表格 */
        .table-wrap table { min-width: 1100px; font-size: 13px; }
        .table-wrap th,
        .table-wrap td { padding: 6px 8px; white-space: nowrap; vertical-align: middle; }
        .table-wrap th { background: #f8fafd; border-bottom: 2px solid #dce3ec; }
        .vs-large { font-weight: 700; color: #3b7cff; margin: 0 4px; }
        .score-vs { font-weight: 600; min-width: 30px; display: inline-block; text-align: center; }
        .checkbox-cell { text-align: center; }
        .checkbox-cell input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; }
        .select-all-label { display: flex; align-items: center; gap: 4px; cursor: pointer; font-weight: normal; font-size: 12px; }
        .select-all-label input { margin: 0; }
        .result-select { padding: 2px 6px; border-radius: 4px; border: 1px solid #cdd8e6; }

        /* 可写入字段样式（表格内联） */
        .inline-edit {
            width: 62px;
            padding: 2px 4px;
            border: 1px solid #d1d9e6;
            border-radius: 4px;
            text-align: center;
            font-size: 13px;
            background: #fafbfc;
            transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
        }
        .inline-edit:hover {
            border-color: #9bb7d4;
            background: #ffffff;
        }
        .inline-edit:focus {
            outline: none;
            border-color: #3b7cff;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(59, 124, 255, 0.15);
        }
        .inline-edit.saving {
            opacity: 0.6;
            background: #f0f4ff;
        }

        /* 赔率分析对话框中的编辑框（输入框和下拉框统一风格） */
        .analysis-input {
            flex: 1;
            padding: 2px 8px;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            background: #f0f6ff;
            color: #1a3a6b;
            transition: background 0.15s, box-shadow 0.15s;
            cursor: text;
            min-width: 80px;
        }
        .analysis-input:hover {
            background: #dce7ff;
        }
        .analysis-input:focus {
            outline: none;
            background: #ffffff;
            box-shadow: 0 0 0 2px rgba(59, 124, 255, 0.3);
        }
        .analysis-input.saving {
            opacity: 0.6;
            background: #f0f4ff;
        }
        /* 下拉框特殊样式 */
        select.analysis-input {
            cursor: pointer;
            appearance: auto;
            padding-right: 20px;
        }

        .prediction-clickable {
            cursor: pointer;
            color: #1a3a6b;
            text-decoration: underline dotted #3b7cff;
            padding: 2px 8px;
            display: inline-block;
            border-radius: 4px;
            background: #f0f6ff;
            transition: background 0.15s, color 0.15s;
            font-weight: 500;
            min-width: 40px;
            text-align: center;
        }
        .prediction-clickable:hover {
            background: #dce7ff;
            color: #0f2a4a;
            text-decoration: underline solid #3b7cff;
        }
        .prediction-clickable.empty {
            color: #9aa8b9;
            background: #f5f7fa;
            text-decoration: none;
            font-weight: 400;
        }
        .prediction-clickable.empty:hover {
            background: #e8ecf2;
            color: #6b7a8a;
        }

        /* 保存提示小标签 */
        .save-tag {
            font-size: 11px;
            color: #4b7a3b;
            margin-left: 4px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .save-tag.show {
            opacity: 1;
        }

        /* 只读显示文本（保留其他只读列） */
        .readonly-text {
            display: inline-block;
            padding: 4px 6px;
            background: #f9fafc;
            border-radius: 4px;
            min-width: 30px;
            text-align: center;
            color: #1f2937;
        }
    </style>
</head>
<body>
    <div class="container">
        {% include '_navbar.html' %}

        <h1>📋 赔率预测</h1>

        <div class="section-divider">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:15px;">
                <h2 class="section-title">📊 预测记录</h2>
                <div style="display:flex; gap:8px; align-items:center;">
                    <button class="action-btn add-btn" id="addMatchBtn" style="padding:6px 14px; font-size:13px;">➕ 手动添加</button>
                    <button class="action-btn batch-delete-btn" id="batchDeleteBtn" style="padding:6px 14px; font-size:13px;">🗑️ 批量删除</button>
                </div>
            </div>
            <div class="filter-row">
                <label>日期筛选：</label>
                <input type="date" id="filter-date">
                <button id="filterBtn">筛选</button>
                <button id="clearFilterBtn">清除筛选</button>
            </div>
            <div id="loading" style="padding:20px; text-align:center;">加载中...</div>
            <div id="tableWrap" style="display:none; overflow-x:auto;">
                <table>
                    <thead>
                        <tr>
                            <th style="width:50px;">
                                <label class="select-all-label">
                                    <input type="checkbox" id="selectAllCheckbox">
                                    <span>全选</span>
                                </label>
                            </th>
                            <th>ID</th>
                            <th>日期</th>
                            <th>时间</th>
                            <th>联赛</th>
                            <th>主队 VS 客队</th>
                            <th>基本面评分</th>
                            <th>基本面判断</th>
                            <th style="min-width:70px;">初01</th>
                            <th style="min-width:70px;">初02</th>
                            <th style="min-width:70px; text-align:center;">初测</th>
                            <th>结果</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="historyBody"></tbody>
                </table>
            </div>
            <div class="pagination" id="pagination" style="display:none;">
                <button id="prevPageBtn" disabled>上一页</button>
                <span id="pageNumbers"></span>
                <button id="nextPageBtn" disabled>下一页</button>
                <select id="perPageSelect" style="margin-left:10px;padding:4px 8px;border-radius:6px;border:1px solid #cdd8e6;">
                    <option value="10">10条/页</option>
                    <option value="20" selected>20条/页</option>
                    <option value="50">50条/页</option>
                    <option value="100">100条/页</option>
                </select>
                <span style="font-size:13px; color:#4b657a; margin-left:8px;">共 <span id="totalCount">0</span> 条</span>
            </div>
        </div>

        <!-- ====== 赔率分析展示模态框 ====== -->
        <div id="analysisModal" class="modal-edit">
            <div class="modal-edit-content">
                <h3 id="analysisModalTitle">📊 赔率分析 - 赛事信息</h3>
                <div id="analysisInfoContainer">
                    <!-- 动态渲染 -->
                </div>
                <div class="btn-group">
                    <button class="btn" id="saveAnalysisBtn">💾 保存修改</button>
                    <button class="btn btn-secondary" id="closeAnalysisBtn">关闭</button>
                </div>
            </div>
        </div>

        

        <!-- ====== 旧编辑模态框（保留备用） ====== -->
        <div id="editModal" class="modal-edit">
            <div class="modal-edit-content">
                <h3 id="editTitle">📝 预测/复盘</h3>
                <div id="editFormContainer"></div>
                <div class="btn-group">
                    <button class="btn" id="saveEditBtn">💾 保存修改</button>
                    <button class="btn btn-secondary" id="cancelEditBtn">取消</button>
                </div>
            </div>
        </div>

        <div id="toast" class="toast"></div>

        <script>
        (function() {
            // ---------- DOM 引用 ----------
            const tbody = document.getElementById('historyBody');
            const loading = document.getElementById('loading');
            const tableWrap = document.getElementById('tableWrap');
            const filterDate = document.getElementById('filter-date');
            const filterBtn = document.getElementById('filterBtn');
            const clearFilterBtn = document.getElementById('clearFilterBtn');

            const analysisModal = document.getElementById('analysisModal');
            const analysisModalTitle = document.getElementById('analysisModalTitle');
            const analysisInfoContainer = document.getElementById('analysisInfoContainer');
            const closeAnalysisBtn = document.getElementById('closeAnalysisBtn');
            const saveAnalysisBtn = document.getElementById('saveAnalysisBtn');

            const editModal = document.getElementById('editModal');
            const editTitle = document.getElementById('editTitle');
            const editFormContainer = document.getElementById('editFormContainer');
            const saveEditBtn = document.getElementById('saveEditBtn');
            const cancelEditBtn = document.getElementById('cancelEditBtn');

            const batchDeleteBtn = document.getElementById('batchDeleteBtn');
            const selectAllCheckbox = document.getElementById('selectAllCheckbox');
            const addMatchBtn = document.getElementById('addMatchBtn');

            const pagination = document.getElementById('pagination');
            const prevPageBtn = document.getElementById('prevPageBtn');
            const nextPageBtn = document.getElementById('nextPageBtn');
            const pageNumbers = document.getElementById('pageNumbers');
            const perPageSelect = document.getElementById('perPageSelect');
            const totalCountSpan = document.getElementById('totalCount');
            const toast = document.getElementById('toast');

            let currentOffset = 0,
                currentLimit = 20,
                currentDateFilter = '',
                totalItems = 0;

            const judgmentMap = {
                'home_advantage': '主队占优',
                'away_advantage': '客队占优',
                'equal': '两队实力相当',
                'home_strong': '主队较强优势',
                'away_strong': '客队较强优势',
                'home_dominant': '主队绝对优势',
                'away_dominant': '客队绝对优势',
                'both_weak': '两队菜鸡'
            };

            let toastTimer;

            function showToast(msg) {
                toast.textContent = msg;
                toast.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
            }

            // 兼容旧JSON格式的初盘预测显示
            function getPredictionDisplay(initialPrediction) {
                if (!initialPrediction) return '';
                if (typeof initialPrediction === 'string' && (initialPrediction.startsWith('[') || initialPrediction.startsWith('{'))) {
                    try {
                        const parsed = JSON.parse(initialPrediction);
                        if (Array.isArray(parsed) && parsed.length > 0) {
                            return parsed[0];
                        }
                        return initialPrediction;
                    } catch (e) {
                        return initialPrediction;
                    }
                }
                return initialPrediction;
            }

            function getInitialPredictionValue(data) {
                let val = data.initial_prediction || '';
                if (typeof val === 'string' && (val.startsWith('[') || val.startsWith('{'))) {
                    try {
                        const parsed = JSON.parse(val);
                        if (Array.isArray(parsed) && parsed.length > 0) {
                            return parsed[0];
                        }
                        return '';
                    } catch (e) {
                        return '';
                    }
                }
                return val;
            }

            function saveField(id, field, value) {
                return fetch('/api/match/' + id)
                    .then(res => {
                        if (!res.ok) throw new Error('获取数据失败');
                        return res.json();
                    })
                    .then(data => {
                        const payload = { ...data };
                        payload[field] = value;
                        return fetch('/api/match/' + id, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                    })
                    .then(res => {
                        if (!res.ok) return res.json().then(err => { throw new Error(err.error || '保存失败'); });
                        return res.json();
                    });
            }

            // ---------- 加载历史 ----------
            function loadHistory(date, limit, offset) {
                if (date === undefined) date = currentDateFilter;
                if (limit === undefined) limit = currentLimit;
                if (offset === undefined) offset = currentOffset;

                loading.style.display = 'block';
                tableWrap.style.display = 'none';
                let url = `/api/history?limit=${limit}&offset=${offset}`;
                if (date) url += '&date=' + date;

                fetch(url)
                    .then(res => {
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        return res.json();
                    })
                    .then(data => {
                        loading.style.display = 'none';
                        tableWrap.style.display = 'block';
                        const matches = data.data || [];
                        totalItems = data.total || 0;
                        currentLimit = data.limit || limit;
                        currentOffset = data.offset || offset;

                        if (matches.length === 0) {
                            tbody.innerHTML = '<tr><td colspan="13" style="text-align:center;padding:30px;">暂无预测记录</td></tr>';
                            pagination.style.display = 'none';
                            return;
                        }

                        let html = '';
                        matches.forEach(m => {
                            const result = m.result || '未定';
                            let resultHtml = result;
                            if (result === '红') resultHtml = `<span style="color:#dc2626;font-weight:600;">红</span>`;
                            else if (result === '黑') resultHtml = `<span style="color:#1f2937;font-weight:600;">黑</span>`;
                            else if (result === '走盘') resultHtml =
                                `<span style="color:#d97706;font-weight:600;">走盘</span>`;
                            const judgmentDisplay = judgmentMap[m.judgment] || m.judgment || '';
                            const homeScore = Math.round(parseFloat(m.home_score) || 0);
                            const awayScore = Math.round(parseFloat(m.away_score) || 0);
                            const scoreDisplay =
                                `<span class="score-vs">${homeScore}</span> <span class="vs-large">VS</span> <span class="score-vs">${awayScore}</span>`;

                            const predDisplay = getPredictionDisplay(m.initial_prediction) || '—';
                            const isEmptyPred = !m.initial_prediction || m.initial_prediction === '[]' || m
                                .initial_prediction === '""' || m.initial_prediction === 'null';

                            const pos1Val = m.pos1 || '';
                            const pos2Val = m.pos2 || '';

                            html += `<tr>
                                    <td class="checkbox-cell"><input type="checkbox" class="row-checkbox" data-id="${m.id}"></td>
                                    <td>${m.id}</td>
                                    <td>${m.date || ''}</td>
                                    <td>${m.time || ''}</td>
                                    <td>${m.league || ''}</td>
                                    <td><a href="/?id=${m.id}" class="team-link">${m.home_team}</a> <span class="vs-large">VS</span> <a href="/?id=${m.id}" class="team-link">${m.away_team}</a></td>
                                    <td>${scoreDisplay}</td>
                                    <td>${judgmentDisplay}</td>
                                    <!-- 初01 -->
                                    <td>
                                        <input type="text" class="inline-edit inline-pos1" data-id="${m.id}" data-field="pos1" value="${pos1Val}" placeholder="—" title="点击编辑初01">
                                        <span class="save-tag" id="saveTag-pos1-${m.id}">✓</span>
                                    </td>
                                    <!-- 初02 -->
                                    <td>
                                        <input type="text" class="inline-edit inline-pos2" data-id="${m.id}" data-field="pos2" value="${pos2Val}" placeholder="—" title="点击编辑初02">
                                        <span class="save-tag" id="saveTag-pos2-${m.id}">✓</span>
                                    </td>
                                    <!-- 初盘预测 (居中对齐) -->
                                    <td style="text-align:center;">
                                        <span class="prediction-clickable ${isEmptyPred ? 'empty' : ''}" style="cursor:default; text-decoration:none;">
                                            ${predDisplay || '—'}
                                        </span>
                                    </td>
                                    <td>
                                        <select class="result-select" data-id="${m.id}">
                                            <option value="">未定</option>
                                            <option value="红" ${result==='红'?'selected':''}>红</option>
                                            <option value="黑" ${result==='黑'?'selected':''}>黑</option>
                                            <option value="走盘" ${result==='走盘'?'selected':''}>走盘</option>
                                        </select>
                                    </td>
                                    <td>
                                        <button class="action-btn odds-analysis-btn" data-id="${m.id}">📊 赔率分析</button>
                                        <button class="action-btn delete-btn" data-id="${m.id}">🗑️ 删除</button>
                                    </td>
                                </tr>`;
                        });
                        tbody.innerHTML = html;
                        bindEvents();
                        updatePagination();
                    })
                    .catch(err => {
                        loading.textContent = '❌ 加载失败: ' + err.message;
                        console.error('加载失败:', err);
                    });
            }

            // ---------- 事件绑定 ----------
            function bindEvents() {
                // 结果下拉
                document.querySelectorAll('.result-select').forEach(sel => {
                    sel.addEventListener('change', function() {
                        const id = this.dataset.id;
                        const val = this.value;
                        fetch('/api/match/' + id + '/result', {
                                method: 'PUT',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ result: val || null })
                            })
                            .then(res => res.json())
                            .then(res => {
                                if (res.success) loadHistory(currentDateFilter, currentLimit,
                                currentOffset);
                                else alert('更新失败: ' + (res.error || '未知错误'));
                            });
                    });
                });

                // 删除单行
                document.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const id = this.dataset.id;
                        if (confirm('确定删除该预测记录吗？')) {
                            fetch('/api/match/' + id, { method: 'DELETE' })
                                .then(res => res.json())
                                .then(res => {
                                    if (res.success) loadHistory(currentDateFilter, currentLimit,
                                        currentOffset);
                                    else alert('删除失败: ' + (res.error || '未知错误'));
                                });
                        }
                    });
                });

                // 全选
                selectAllCheckbox.addEventListener('change', function() {
                    const checked = this.checked;
                    document.querySelectorAll('.row-checkbox').forEach(cb => cb.checked = checked);
                });

                // 批量删除
                batchDeleteBtn.addEventListener('click', function() {
                    const selected = document.querySelectorAll('.row-checkbox:checked');
                    if (selected.length === 0) { showToast('请至少选择一条记录'); return; }
                    if (!confirm(`确定要删除 ${selected.length} 条记录吗？此操作不可恢复！`)) return;

                    const ids = Array.from(selected).map(cb => parseInt(cb.dataset.id));
                    let successCount = 0,
                        failCount = 0;
                    ids.forEach(id => {
                        fetch('/api/match/' + id, { method: 'DELETE' })
                            .then(res => res.json())
                            .then(res => {
                                res.success ? successCount++ : failCount++;
                                if (successCount + failCount === ids.length) {
                                    showToast(
                                        `批量删除完成：成功 ${successCount} 条，失败 ${failCount} 条`
                                        );
                                    loadHistory(currentDateFilter, currentLimit, currentOffset);
                                }
                            })
                            .catch(() => {
                                failCount++;
                                if (successCount + failCount === ids.length) {
                                    showToast(
                                        `批量删除完成：成功 ${successCount} 条，失败 ${failCount} 条`
                                        );
                                    loadHistory(currentDateFilter, currentLimit, currentOffset);
                                }
                            });
                    });
                });

                // 初01、初02 输入框（表格内联）
                document.querySelectorAll('.inline-pos1, .inline-pos2').forEach(inp => {
                    inp.addEventListener('blur', function() {
                        handleInlineSave(this);
                    });
                    inp.addEventListener('keydown', function(e) {
                        if (e.key === 'Enter') {
                            e.preventDefault();
                            this.blur();
                        }
                        if (e.key === 'Escape') {
                            this.blur();
                        }
                    });
                    inp.addEventListener('input', function() {
                        const id = this.dataset.id;
                        const field = this.dataset.field;
                        const tag = document.getElementById(`saveTag-${field}-${id}`);
                        if (tag) tag.classList.remove('show');
                    });
                });

                // 赔率分析按钮：打开展示模态框（所有字段可编辑）
                document.querySelectorAll('.odds-analysis-btn').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = this.dataset.id;
                        if (id) {
                            openAnalysisModal(id);
                        }
                    });
                });
            }

            // ---------- 内联保存处理（表格内） ----------
            function handleInlineSave(input) {
                const id = input.dataset.id;
                const field = input.dataset.field;
                const value = input.value.trim();
                const tag = document.getElementById(`saveTag-${field}-${id}`);

                const oldVal = input.defaultValue || '';
                if (value === oldVal) {
                    if (tag) tag.classList.remove('show');
                    return;
                }

                input.classList.add('saving');
                if (tag) tag.classList.remove('show');

                saveField(id, field, value)
                    .then(res => {
                        if (res.success) {
                            input.defaultValue = value;
                            if (tag) tag.classList.add('show');
                            showToast(`✅ ${field} 已保存`);
                        } else {
                            showToast('❌ 保存失败: ' + (res.error || '未知错误'));
                            input.value = oldVal;
                        }
                    })
                    .catch(err => {
                        showToast('❌ 请求出错: ' + err.message);
                        input.value = oldVal;
                    })
                    .finally(() => {
                        input.classList.remove('saving');
                    });
            }

            // ---------- 打开赔率分析（展示+编辑所有字段）模态框 ----------
            function openAnalysisModal(id) {
                fetch('/api/match/' + id)
                    .then(res => {
                        if (!res.ok) throw new Error('获取数据失败');
                        return res.json();
                    })
                    .then(data => {
                        if (data.error) { alert(data.error); return; }

                        analysisModal.dataset.id = id;

                        analysisModalTitle.textContent = `📊 赔率分析 - ${data.home_team} vs ${data.away_team}`;
                        const judgmentDisplay = judgmentMap[data.judgment] || data.judgment || '—';
                        const pos1Val = data.pos1 || '';
                        const pos2Val = data.pos2 || '';
                        const asianVal = data.asian_odds || '';
                        const rangeVal = data.range || '';
                        const initialAnalysisVal = data.initial_analysis || '';
                        const finalAnalysisVal = data.final_analysis || '';
                        const predVal = getInitialPredictionValue(data);

                        analysisModal.dataset.oldPos1 = pos1Val;
                        analysisModal.dataset.oldPos2 = pos2Val;
                        analysisModal.dataset.oldAsian = asianVal;
                        analysisModal.dataset.oldRange = rangeVal;
                        analysisModal.dataset.oldInitialAnalysis = initialAnalysisVal;
                        analysisModal.dataset.oldFinalAnalysis = finalAnalysisVal;
                        analysisModal.dataset.oldPred = predVal;

                        let infoHtml = `
                            <div class="info-row"><span class="info-label">ID</span><span class="info-value">${data.id}</span></div>
                            <div class="info-row"><span class="info-label">联赛</span><span class="info-value">${data.league || '—'}</span></div>
                            <div class="info-row"><span class="info-label">基本面判断</span><span class="info-value">${judgmentDisplay}</span></div>

                            <!-- 亚初终 -->
                            <div class="form-group">
                                <span class="info-label" style="width:120px;">亚初终</span>
                                <input type="text" id="analysis-asian" class="analysis-input" value="${asianVal}" placeholder="如 0.85 半球 0.95" data-id="${data.id}" data-field="asian_odds">
                                <span class="save-tag" id="analysis-saveTag-asian-${data.id}">✓</span>
                            </div>
                            <!-- 区间 -->
                            <div class="form-group">
                                <span class="info-label" style="width:120px;">区间</span>
                                <input type="text" id="analysis-range" class="analysis-input" value="${rangeVal}" placeholder="如 2.5-3" data-id="${data.id}" data-field="range">
                                <span class="save-tag" id="analysis-saveTag-range-${data.id}">✓</span>
                            </div>
                            <!-- 初赔分析 -->
                            <div class="form-group">
                                <span class="info-label" style="width:120px;">初赔分析</span>
                                <input type="text" id="analysis-initial_analysis" class="analysis-input" value="${initialAnalysisVal}" placeholder="初赔分析" data-id="${data.id}" data-field="initial_analysis">
                                <span class="save-tag" id="analysis-saveTag-initial_analysis-${data.id}">✓</span>
                            </div>
                            <!-- 终赔分析 -->
                            <div class="form-group">
                                <span class="info-label" style="width:120px;">终赔分析</span>
                                <input type="text" id="analysis-final_analysis" class="analysis-input" value="${finalAnalysisVal}" placeholder="终赔分析" data-id="${data.id}" data-field="final_analysis">
                                <span class="save-tag" id="analysis-saveTag-final_analysis-${data.id}">✓</span>
                            </div>

                            <!-- 初01 -->
                            <div class="form-group" style="margin-top:10px;">
                                <span class="info-label" style="width:120px;">初01</span>
                                <input type="text" id="analysis-pos1" class="analysis-input" value="${pos1Val}" placeholder="—" data-id="${data.id}" data-field="pos1">
                                <span class="save-tag" id="analysis-saveTag-pos1-${data.id}">✓</span>
                            </div>
                            <!-- 初02 -->
                            <div class="form-group">
                                <span class="info-label" style="width:120px;">初02</span>
                                <input type="text" id="analysis-pos2" class="analysis-input" value="${pos2Val}" placeholder="—" data-id="${data.id}" data-field="pos2">
                                <span class="save-tag" id="analysis-saveTag-pos2-${data.id}">✓</span>
                            </div>
                            <!-- 初盘预测 下拉框 -->
                            <div class="form-group">
                                <span class="info-label" style="width:120px;">初测</span>
                                <select id="analysis-initial_prediction" class="analysis-input" style="background:#f0f6ff; border:none; border-radius:4px; padding:2px 8px; font-size:13px; color:#1a3a6b; cursor:pointer; min-width:80px;">
                                    <option value="">请选择</option>
                                    <option value="胜" ${predVal === '胜' ? 'selected' : ''}>胜</option>
                                    <option value="平" ${predVal === '平' ? 'selected' : ''}>平</option>
                                    <option value="负" ${predVal === '负' ? 'selected' : ''}>负</option>
                                    <option value="上盘" ${predVal === '上盘' ? 'selected' : ''}>上盘</option>
                                    <option value="下盘" ${predVal === '下盘' ? 'selected' : ''}>下盘</option>
                                    <option value="大球" ${predVal === '大球' ? 'selected' : ''}>大球</option>
                                    <option value="小球" ${predVal === '小球' ? 'selected' : ''}>小球</option>
                                </select>
                                <span class="save-tag" id="analysis-saveTag-initial_prediction-${data.id}">✓</span>
                            </div>
                        `;
                        analysisInfoContainer.innerHTML = infoHtml;
                        analysisModal.style.display = 'flex';

                        // 绑定输入框事件
                        document.querySelectorAll('#analysis-pos1, #analysis-pos2, #analysis-asian, #analysis-range, #analysis-initial_analysis, #analysis-final_analysis, #analysis-initial_prediction').forEach(el => {
                            el.addEventListener('input', function() {
                                const id = this.dataset.id;
                                const field = this.dataset.field || 'initial_prediction';
                                const tag = document.getElementById(`analysis-saveTag-${field}-${id}`);
                                if (tag) tag.classList.remove('show');
                            });
                            el.addEventListener('keydown', function(e) {
                                if (e.key === 'Enter') {
                                    e.preventDefault();
                                    this.blur();
                                }
                                if (e.key === 'Escape') {
                                    this.blur();
                                }
                            });
                        });
                    })
                    .catch(err => {
                        showToast('❌ 加载数据失败: ' + err.message);
                    });
            }

            function closeAnalysisModal() {
                analysisModal.style.display = 'none';
            }

            // ---------- 保存所有数据 ----------
            function saveAnalysisData() {
                const id = analysisModal.dataset.id;
                if (!id) {
                    showToast('❌ 未找到赛事ID');
                    return;
                }

                const pos1Input = document.getElementById('analysis-pos1');
                const pos2Input = document.getElementById('analysis-pos2');
                const asianInput = document.getElementById('analysis-asian');
                const rangeInput = document.getElementById('analysis-range');
                const initialAnalysisInput = document.getElementById('analysis-initial_analysis');
                const finalAnalysisInput = document.getElementById('analysis-final_analysis');
                const initialPredictionSelect = document.getElementById('analysis-initial_prediction');

                const pos1Val = pos1Input ? pos1Input.value.trim() : '';
                const pos2Val = pos2Input ? pos2Input.value.trim() : '';
                const asianVal = asianInput ? asianInput.value.trim() : '';
                const rangeVal = rangeInput ? rangeInput.value.trim() : '';
                const initialAnalysisVal = initialAnalysisInput ? initialAnalysisInput.value.trim() : '';
                const finalAnalysisVal = finalAnalysisInput ? finalAnalysisInput.value.trim() : '';
                const initialPredictionVal = initialPredictionSelect ? initialPredictionSelect.value : '';

                saveAnalysisBtn.textContent = '⏳ 保存中...';
                saveAnalysisBtn.disabled = true;

                fetch('/api/match/' + id)
                    .then(res => {
                        if (!res.ok) throw new Error('获取当前数据失败');
                        return res.json();
                    })
                    .then(data => {
                        data.pos1 = pos1Val;
                        data.pos2 = pos2Val;
                        data.asian_odds = asianVal;
                        data.range = rangeVal;
                        data.initial_analysis = initialAnalysisVal;
                        data.final_analysis = finalAnalysisVal;
                        data.initial_prediction = initialPredictionVal;

                        return fetch('/api/match/' + id, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(data)
                        });
                    })
                    .then(res => {
                        if (!res.ok) return res.json().then(err => { throw new Error(err.error || '更新失败'); });
                        return res.json();
                    })
                    .then(result => {
                        if (result.success) {
                            analysisModal.dataset.oldPos1 = pos1Val;
                            analysisModal.dataset.oldPos2 = pos2Val;
                            analysisModal.dataset.oldAsian = asianVal;
                            analysisModal.dataset.oldRange = rangeVal;
                            analysisModal.dataset.oldInitialAnalysis = initialAnalysisVal;
                            analysisModal.dataset.oldFinalAnalysis = finalAnalysisVal;
                            analysisModal.dataset.oldPred = initialPredictionVal;

                            const fields = ['pos1', 'pos2', 'asian', 'range', 'initial_analysis', 'final_analysis', 'initial_prediction'];
                            fields.forEach(field => {
                                const tag = document.getElementById(`analysis-saveTag-${field}-${id}`);
                                if (tag) tag.classList.add('show');
                            });

                            showToast('✅ 所有数据保存成功！');
                            loadHistory(currentDateFilter, currentLimit, currentOffset);
                        } else {
                            throw new Error(result.error || '未知错误');
                        }
                    })
                    .catch(err => {
                        showToast('❌ 保存失败: ' + err.message);
                        console.error('保存错误:', err);
                        // 恢复输入框为旧值
                        const oldPos1 = analysisModal.dataset.oldPos1 || '';
                        const oldPos2 = analysisModal.dataset.oldPos2 || '';
                        const oldAsian = analysisModal.dataset.oldAsian || '';
                        const oldRange = analysisModal.dataset.oldRange || '';
                        const oldInitialAnalysis = analysisModal.dataset.oldInitialAnalysis || '';
                        const oldFinalAnalysis = analysisModal.dataset.oldFinalAnalysis || '';
                        const oldPred = analysisModal.dataset.oldPred || '';
                        if (pos1Input) pos1Input.value = oldPos1;
                        if (pos2Input) pos2Input.value = oldPos2;
                        if (asianInput) asianInput.value = oldAsian;
                        if (rangeInput) rangeInput.value = oldRange;
                        if (initialAnalysisInput) initialAnalysisInput.value = oldInitialAnalysis;
                        if (finalAnalysisInput) finalAnalysisInput.value = oldFinalAnalysis;
                        if (initialPredictionSelect) initialPredictionSelect.value = oldPred;
                    })
                    .finally(() => {
                        saveAnalysisBtn.textContent = '💾 保存修改';
                        saveAnalysisBtn.disabled = false;
                    });
            }

            // ---------- 分页 ----------
            function updatePagination() {
                const totalPages = Math.ceil(totalItems / currentLimit) || 1;
                const currentPage = Math.floor(currentOffset / currentLimit) + 1;
                totalCountSpan.textContent = totalItems;

                let html = '';
                const maxVisible = 7;
                let startPage = 1,
                    endPage = totalPages;
                if (totalPages > maxVisible) {
                    const half = Math.floor(maxVisible / 2);
                    if (currentPage <= half + 1) endPage = maxVisible;
                    else if (currentPage >= totalPages - half) startPage = totalPages - maxVisible + 1;
                    else { startPage = currentPage - half;
                        endPage = currentPage + half; }
                }
                if (startPage > 1) {
                    html += `<span class="page-num" data-page="1">1</span>`;
                    if (startPage > 2) html += `<span class="ellipsis">…</span>`;
                }
                for (let i = startPage; i <= endPage; i++) {
                    html += `<span class="page-num ${i===currentPage?'active':''}" data-page="${i}">${i}</span>`;
                }
                if (endPage < totalPages) {
                    if (endPage < totalPages - 1) html += `<span class="ellipsis">…</span>`;
                    html += `<span class="page-num" data-page="${totalPages}">${totalPages}</span>`;
                }
                pageNumbers.innerHTML = html;
                document.querySelectorAll('.page-num').forEach(el => {
                    el.addEventListener('click', function() {
                        const page = parseInt(this.dataset.page);
                        if (page >= 1 && page <= totalPages) goToPage((page - 1) * currentLimit);
                    });
                });
                prevPageBtn.disabled = currentOffset === 0;
                nextPageBtn.disabled = currentOffset + currentLimit >= totalItems;
                pagination.style.display = 'flex';
            }

            function goToPage(offset) {
                if (offset < 0) offset = 0;
                if (offset >= totalItems) offset = Math.max(0, totalItems - currentLimit);
                currentOffset = offset;
                loadHistory(currentDateFilter, currentLimit, currentOffset);
            }

            // ---------- 手动添加 ----------
            function addEmptyMatch() {
                const payload = {
                    date: '',
                    time: '',
                    league: '',
                    home_team: '主队',
                    away_team: '客队',
                    home_score: 0,
                    away_score: 0,
                    home_prob: 0.33,
                    draw_prob: 0.34,
                    away_prob: 0.33,
                    judgment: 'equal',
                    asian_odds: '',
                    range: '',
                    pos1: '',
                    pos2: '',
                    initial_analysis: '',
                    final_analysis: '',
                    initial_prediction: ''
                };
                fetch('/api/save', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    })
                    .then(res => res.json())
                    .then(res => {
                        if (res.success) {
                            showToast('✅ 空记录已创建，ID: ' + res.id);
                            loadHistory(currentDateFilter, currentLimit, currentOffset);
                        } else showToast('❌ 创建失败: ' + (res.error || '未知错误'));
                    })
                    .catch(err => showToast('❌ 请求出错: ' + err.message));
            }

            // ---------- 全局事件绑定 ----------
            filterBtn.addEventListener('click', function() {
                currentDateFilter = filterDate.value;
                currentOffset = 0;
                loadHistory(currentDateFilter, currentLimit, 0);
            });
            clearFilterBtn.addEventListener('click', function() {
                filterDate.value = '';
                currentDateFilter = '';
                currentOffset = 0;
                loadHistory('', currentLimit, 0);
            });
            addMatchBtn.addEventListener('click', addEmptyMatch);

            prevPageBtn.addEventListener('click', () => goToPage(currentOffset - currentLimit));
            nextPageBtn.addEventListener('click', () => goToPage(currentOffset + currentLimit));
            perPageSelect.addEventListener('change', function() {
                currentLimit = parseInt(this.value);
                currentOffset = 0;
                loadHistory(currentDateFilter, currentLimit, 0);
            });

            closeAnalysisBtn.addEventListener('click', closeAnalysisModal);
            saveAnalysisBtn.addEventListener('click', saveAnalysisData);
            window.addEventListener('click', function(e) {
                if (e.target === analysisModal) closeAnalysisModal();
            });

            cancelEditBtn.addEventListener('click', function() { editModal.style.display = 'none'; });
            window.addEventListener('click', function(e) {
                if (e.target === editModal) editModal.style.display = 'none';
            });
            saveEditBtn.addEventListener('click', function() {
                alert('请使用“赔率分析”按钮进行编辑。');
            });

            loadHistory('', 20, 0);
        })();
        </script>
    </div>
</body>
</html>
